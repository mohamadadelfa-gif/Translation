name: Repository structural audit

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run structural audit
        run: python -B tools/audit_repository.py
